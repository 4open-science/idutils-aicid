[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idutils-aicid"
version = "0.1.0"
description = "idutils custom scheme for AICID — persistent identifiers for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Martin Monperrus" }]
dependencies = ["idutils>=1.2.0"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[project.entry-points."idutils.custom_schemes"]
aicid = "idutils_aicid:aicid_scheme"

[tool.hatch.build.targets.wheel]
include = ["idutils_aicid.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
